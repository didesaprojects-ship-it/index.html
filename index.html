<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Engineer Mini App</title>
    <!-- Include Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-color: #06b6d4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--hint-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button.btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn:active {
            opacity: 0.8;
        }

        .result {
            margin-top: 12px;
            padding: 10px;
            background: rgba(6, 182, 212, 0.1);
            border-left: 4px solid var(--accent-color);
            font-size: 0.95rem;
            border-radius: 4px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <h2>⚙️ Master Engineer Suite</h2>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('beam')">Beam Stress</div>
        <div class="tab" onclick="switchTab('converter')">Unit Converter</div>
    </div>

    <!-- Tab 1: Beam / Mechanical Calculator -->
    <div id="beam" class="tab-content active">
        <div class="card">
            <h3>Simple Beam Deflection Calculator</h3>
            <div class="input-group">
                <label>Load Force ($P$ in Newtons):</label>
                <input type="number" id="force" value="1000">
            </div>
            <div class="input-group">
                <label>Beam Length ($L$ in meters):</label>
                <input type="number" id="length" value="3">
            </div>
            <div class="input-group">
                <label>Moment of Inertia ($I$ in $m^4$):</label>
                <input type="number" id="inertia" value="0.00005" step="0.00001">
            </div>
            <div class="input-group">
                <label>Elastic Modulus ($E$ in GPa):</label>
                <input type="number" id="modulus" value="200">
            </div>
            <button class="btn" onclick="calculateBeam()">Calculate Max Deflection</button>
            <div id="beamResult" class="result" style="display:none;"></div>
        </div>
    </div>

    <!-- Tab 2: Engineering Unit Converter -->
    <div id="converter" class="tab-content">
        <div class="card">
            <h3>Pressure / Stress Converter</h3>
            <div class="input-group">
                <label>Value in MPa (MegaPascals):</label>
                <input type="number" id="mpaInput" value="10" oninput="convertPressure()">
            </div>
            <div id="pressureResult" class="result">
                Equivalent: 10,000 kPa | 1,450.38 psi | 98.69 Atm
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Expand mini app to full screen height

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if(tabId === 'beam') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('beam').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('converter').classList.add('active');
            }
        }

        // Beam Calculation Logic (Center-loaded simple beam formula: delta = (P * L^3) / (48 * E * I))
        function calculateBeam() {
            let P = parseFloat(document.getElementById('force').value);
            let L = parseFloat(document.getElementById('length').value);
            let I = parseFloat(document.getElementById('inertia').value);
            let E_gpa = parseFloat(document.getElementById('modulus').value);
            
            let E = E_gpa * 1e9; // Convert GPa to Pascals (N/m^2)

            if(!P || !L || !I || !E) {
                alert('Please enter valid numbers for all fields.');
                return;
            }

            let deflection = (P * Math.pow(L, 3)) / (48 * E * I); // in meters
            let deflectionMm = deflection * 1000;

            let resDiv = document.getElementById('beamResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<strong>Max Deflection:</strong> ${deflectionMm.toFixed(4)} mm (${deflection.toExponential(4)} m)`;
            
            // Optional: trigger Telegram Haptic feedback
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // Pressure Converter Logic
        function convertPressure() {
            let mpa = parseFloat(document.getElementById('mpaInput').value) || 0;
            let kpa = mpa * 1000;
            let psi = mpa * 145.038;
            let atm = mpa * 9.86923;

            document.getElementById('pressureResult').innerHTML = 
                `Equivalent: ${kpa.toLocaleString()} kPa | ${psi.toFixed(2)} psi | ${atm.toFixed(2)} atm`;
        }
    </script>
</body>
</html>
