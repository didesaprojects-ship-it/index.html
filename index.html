<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Engineer Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-color: #06b6d4;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1rem;
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button.btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button.btn:active {
            opacity: 0.8;
        }

        .result {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(6, 182, 212, 0.1);
            border-left: 4px solid var(--accent-color);
            font-size: 0.95rem;
            border-radius: 4px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            color: var(--hint-color);
        }

        .tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(6, 182, 212, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚙️ Master Engineer Suite</h2>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('beam')">Beam Calculator</div>
        <div class="tab" onclick="switchTab('converter')">Unit Converter</div>
        <div class="tab" onclick="switchTab('ohms')">Ohm's Law</div>
    </div>

    <!-- Tab 1: Beam Deflection Calculator -->
    <div id="beam" class="tab-content active">
        <div class="card">
            <h3>Simply Supported Beam Deflection</h3>
            <div class="input-group">
                <label for="force">Load Force (P in Newtons):</label>
                <input type="number" id="force" value="1000">
            </div>
            <div class="input-group">
                <label for="length">Beam Length (L in meters):</label>
                <input type="number" id="length" value="3">
            </div>
            <div class="input-group">
                <label for="inertia">Moment of Inertia (I in m⁴):</label>
                <input type="number" id="inertia" value="0.00005" step="0.00001">
            </div>
            <div class="input-group">
                <label for="modulus">Elastic Modulus (E in GPa):</label>
                <input type="number" id="modulus" value="200">
            </div>
            <button class="btn" onclick="calculateBeam()">Calculate Deflection</button>
            <div id="beamResult" class="result" style="display:none;"></div>
        </div>
    </div>

    <!-- Tab 2: Pressure & Unit Converter -->
    <div id="converter" class="tab-content">
        <div class="card">
            <h3>Pressure / Stress Converter</h3>
            <div class="input-group">
                <label for="mpaInput">Value in MegaPascals (MPa):</label>
                <input type="number" id="mpaInput" value="10" oninput="convertPressure()">
            </div>
            <div id="pressureResult" class="result">
                Equivalent: 10,000 kPa | 1,450.38 psi | 98.69 atm
            </div>
        </div>
    </div>

    <!-- Tab 3: Electrical Engineering (Ohm's Law) -->
    <div id="ohms" class="tab-content">
        <div class="card">
            <h3>Ohm's Law & Power Calculator</h3>
            <div class="input-group">
                <label for="voltage">Voltage (V in Volts):</label>
                <input type="number" id="voltage" value="12" oninput="calculateOhms()">
            </div>
            <div class="input-group">
                <label for="resistance">Resistance (R in Ohms Ω):</label>
                <input type="number" id="resistance" value="4" oninput="calculateOhms()">
            </div>
            <div id="ohmsResult" class="result">
                Current (I): 3.00 A | Power (P): 36.00 W
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App SDK
        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Tab Navigation Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const selectedTab = Array.from(document.querySelectorAll('.tab')).find(
                t => t.getAttribute('onclick').includes(tabId)
            );
            if (selectedTab) selectedTab.classList.add('active');
            
            const selectedContent = document.getElementById(tabId);
            if (selectedContent) selectedContent.classList.add('active');
        }

        // Beam Calculation Logic: δ = (P * L³) / (48 * E * I)
        function calculateBeam() {
            const P = parseFloat(document.getElementById('force').value);
            const L = parseFloat(document.getElementById('length').value);
            const I = parseFloat(document.getElementById('inertia').value);
            const E_gpa = parseFloat(document.getElementById('modulus').value);
            
            const E = E_gpa * 1e9; // GPa to Pascals

            if (!P || !L || !I || !E) {
                alert('Please fill out all fields with valid numbers.');
                return;
            }

            const deflection = (P * Math.pow(L, 3)) / (48 * E * I);
            const deflectionMm = deflection * 1000;

            const resDiv = document.getElementById('beamResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<strong>Max Deflection:</strong> ${deflectionMm.toFixed(4)} mm<br>` +
                               `<small>(${deflection.toExponential(4)} m)</small>`;

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // Pressure Converter Logic
        function convertPressure() {
            const mpa = parseFloat(document.getElementById('mpaInput').value) || 0;
            const kpa = mpa * 1000;
            const psi = mpa * 145.038;
            const atm = mpa * 9.86923;

            document.getElementById('pressureResult').innerHTML = 
                `<strong>Equivalent Values:</strong><br>` +
                `• ${kpa.toLocaleString()} kPa<br>` +
                `• ${psi.toFixed(2)} psi<br>` +
                `• ${atm.toFixed(2)} atm`;
        }

        // Ohm's Law Calculator Logic: I = V / R, P = V * I
        function calculateOhms() {
            const V = parseFloat(document.getElementById('voltage').value) || 0;
            const R = parseFloat(document.getElementById('resistance').value) || 0;

            if (R === 0) {
                document.getElementById('ohmsResult').innerHTML = `<strong>Current (I):</strong> Infinite (Short Circuit)`;
                return;
            }

            const I = V / R;
            const P = V * I;

            document.getElementById('ohmsResult').innerHTML = 
                `<strong>Current (I):</strong> ${I.toFixed(2)} A<br>` +
                `<strong>Power (P):</strong> ${P.toFixed(2)} W`;
        }
    </script>
</body>
</html>
